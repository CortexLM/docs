name: FernDesk sync

# Lightest durable path: after docs land on main (and on explicit dispatch from
# backend production deploy), upsert Mintlify MDX into the FernDesk Production
# section — the section docs.cortex.foundation serves.
#
# Production only, deliberately. A staging mirror put pre-prod and draft
# articles on the public docs domain, so this workflow does not offer a staging
# target and the sync refuses one if it is ever set. Nothing reaches this
# repository that is not ready to be public.
#
# Factory Droid (custom:deepseek/deepseek-v4.1-flash, effort medium) is the
# agent path for non-mechanical content work / gap fills — see
# scripts/FERNDESK.md. This workflow is the mechanical always-on sync.

on:
  push:
    branches: [main]
    paths:
      - "**/*.mdx"
      - "**/*.md"
      - docs.json
      - scripts/ferndesk_sync.py
      - .github/workflows/ferndesk-sync.yml
  repository_dispatch:
    types: [ferndesk-sync]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only (FERNDESK_DRY_RUN=1)
        type: boolean
        default: false
      retire:
        description: Also unpublish Production articles whose MDX page was deleted (FERNDESK_RETIRE=1)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ferndesk-sync-production
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Mintlify → FernDesk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install curl_cffi
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install curl_cffi

      - name: Restore FernDesk slug cache
        uses: actions/cache@v4
        with:
          path: .ferndesk-slug-cache.json
          key: ferndesk-slug-production-${{ github.run_id }}
          restore-keys: |
            ferndesk-slug-production-

      - name: Sync
        env:
          FERNDESK_API_KEY: ${{ secrets.FERNDESK_API_KEY }}
          FERNDESK_TARGET: production
          FERNDESK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FERNDESK_RETIRE: ${{ github.event_name == 'workflow_dispatch' && inputs.retire && '1' || '0' }}
          DOCS_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ -z "${FERNDESK_API_KEY:-}" ]; then
            echo "FERNDESK_API_KEY secret missing — add it under repo Actions secrets (never commit)." >&2
            exit 1
          fi
          python3 scripts/ferndesk_sync.py
          if [ -f ferndesk-sync-summary.json ]; then
            echo '### FernDesk sync' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ferndesk-sync-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
