name: FernDesk sync

# Lightest durable path: after docs land on main (and on explicit dispatch from
# backend production deploy), upsert Mintlify MDX into FernDesk Production.
# Staging target is available for previews; Compliance owns the always-à-jour gate.
#
# Factory Droid (custom:deepseek/deepseek-v4.1-flash, effort medium) is the
# agent path for non-mechanical content work / gap fills — see
# scripts/FERNDESK.md. This workflow is the mechanical always-on sync.

on:
  push:
    branches: [main]
    paths:
      - "**/*.mdx"
      - "**/*.md"
      - docs.json
      - scripts/ferndesk_sync.py
      - .github/workflows/ferndesk-sync.yml
  repository_dispatch:
    types: [ferndesk-sync]
  workflow_dispatch:
    inputs:
      target:
        description: FernDesk section target
        type: choice
        options: [production, staging]
        default: production
      dry_run:
        description: Plan only (FERNDESK_DRY_RUN=1)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ferndesk-sync-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Mintlify → FernDesk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: t
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "target=${{ github.event.client_payload.target || 'production' }}" >> "$GITHUB_OUTPUT"
            echo "dry=false" >> "$GITHUB_OUTPUT"
          else
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "dry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install curl_cffi
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install curl_cffi

      - name: Sync
        env:
          FERNDESK_API_KEY: ${{ secrets.FERNDESK_API_KEY }}
          FERNDESK_TARGET: ${{ steps.t.outputs.target }}
          FERNDESK_DRY_RUN: ${{ steps.t.outputs.dry == 'true' && '1' || '0' }}
          DOCS_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ -z "${FERNDESK_API_KEY:-}" ]; then
            echo "FERNDESK_API_KEY secret missing — add it under repo Actions secrets (never commit)." >&2
            exit 1
          fi
          python3 scripts/ferndesk_sync.py
          if [ -f ferndesk-sync-summary.json ]; then
            echo '### FernDesk sync' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ferndesk-sync-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
