  <text x="318" y="192" text-anchor="start" font-family="Inter, ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#211F1C">Agent can change the repository.</text>
  <text x="318" y="220" text-anchor="start" font-family="Inter, ui-sans-serif, sans-serif" font-size="13" font-weight="500" fill="#6E6A62">Ask and Plan do not edit files or run shell.</text>
  <text x="318" y="252" text-anchor="start" font-family="Inter, ui-sans-serif, sans-serif" font-size="13" font-weight="500" fill="#211F1C">Stop cancels the live turn. A follow-up can pick</text>
  <text x="318" y="276" text-anchor="start" font-family="Inter, ui-sans-serif, sans-serif" font-size="13" font-weight="500" fill="#211F1C">a different mode. Web Code has no model picker.</text>
  <rect x="298" y="376" width="580" height="88" rx="10" fill="#161412"/>
  <text x="318" y="412" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="500" fill="#FAF8F4">$ cargo test healthz</text>
  <text x="318" y="436" text-anchor="start" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="500" fill="#8AC5B9">ok   healthz_returns_200</text>

